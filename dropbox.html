<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>DiveLog Login</title>
</head>
<body>
    <h2>Login abgeschlossen</h2>
    <p>Die App wird geöffnet …</p>
    <br/>
    <p>Dieses Browserfenster kann nun geschlossen werden …</p>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");

        if (code) {
            const appUrl = `divelog://auth/dropbox?code=${encodeURIComponent(code)}`;
            window.location.href = appUrl;
        } else {
            document.body.innerHTML = "<p>Kein Code erhalten.</p>";
        }
    </script>
</body>
</html>
