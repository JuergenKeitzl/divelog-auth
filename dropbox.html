<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>DiveLog – Dropbox Login</title>
</head>
<body>
<p>Login abgeschlossen. App wird geöffnet …</p>

<script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    if (code) {
        window.location.href = "divelog://auth/dropbox?code=" + code;
    } else {
        document.body.innerText = "Kein OAuth-Code erhalten.";
    }
</script>
</body>
</html>
