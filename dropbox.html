
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dropbox Login</title>
</head>
<body>
  <h2>Login abgeschlossen</h2>
  <p>Du kannst die App jetzt schließen.</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    if (code) {
      fetch("https://your-api-endpoint/save-code", {
        method: "POST",
        body: JSON.stringify({ code }),
        headers: { "Content-Type": "application/json" }
      });
    }
  </script>
</body>
</html>
