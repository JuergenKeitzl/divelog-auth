<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>DiveLog – Dropbox Login</title>
</head>
<body>
<p>Login abgeschlossen!</p>

 <p>Bitte bestätigen, um zur App zurückzukehren.</p>

  <button id="openApp">App öffnen</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    document.getElementById("openApp").onclick = () => {
      if (!code) {
        alert("Kein OAuth-Code gefunden");
        return;
      }

      window.location.href =
        "divelog://auth/dropbox?code=" + encodeURIComponent(code);
    };
  </script>
</body>
</html>
